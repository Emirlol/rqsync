[workspace]
resolver = "3"
members = [
    "crates/*",
    "."
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
quinn = "0.11"
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
bytes = "1.11"
memmap2 = "0.9"
lz4_flex = "0.13"
rkyv = { version = "0.8", features = ["bytes-1"] }
bit-set = "0.10"
thiserror = "2.0"
rayon = "1.12.0"
async-trait = "0.1"
walkdir = "2.5"
parking_lot = "0.12.5"

# Internal crates
client = { path = "crates/client" }
server = { path = "crates/server" }
lib = { path = "crates/lib" }



[package]
name = "speedtest"
version = "0.1.0"
edition = "2024"

[dependencies]
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

client.workspace = true
server.workspace = true
lib.workspace = true
